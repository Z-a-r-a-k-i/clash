name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: |
          if find proto -name '*.proto' 2>/dev/null | grep -q .; then
            buf lint
            buf format --diff --exit-code
          else
            echo "no proto files yet; skipping"
          fi

  gdscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install gdtoolkit
      - run: |
          gd_files="$(git ls-files '*.gd')"
          if [ -n "$gd_files" ]; then
            printf '%s\n' "$gd_files" | xargs gdlint
            printf '%s\n' "$gd_files" | xargs gdformat --check
          else
            echo "no GDScript files yet; skipping"
          fi

  # Server-side checks land at M2 once the server stack is chosen (per ADR 0006).
  # Until then this workflow only gates GDScript and proto.
